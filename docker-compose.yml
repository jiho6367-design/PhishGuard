services:
  phishguard:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - phishguard-data:/app/data
    environment:
      PHISH_BACKEND: rules
      PHISH_DATA_DIR: /app/data
      PHISH_THRESHOLD: ${PHISH_THRESHOLD:-0.20}
      PHISH_API_TOKEN: ${PHISH_API_TOKEN:-}
    restart: "no"

volumes:
  phishguard-data:
